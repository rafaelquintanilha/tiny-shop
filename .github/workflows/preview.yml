name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Publish public/ to pr-${{ github.event.number }}/
        run: |
          dir=site/pr-${{ github.event.number }}
          rm -rf "$dir" && mkdir -p "$dir" && cp -R pr/public/. "$dir"/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preview for PR #${{ github.event.number }} (${{ github.event.pull_request.head.sha }})" || echo "no changes"
          git push origin HEAD:gh-pages
      - name: Wait until the preview is live
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}"
          for i in $(seq 1 60); do
            ok=1
            for f in pr/public/*; do
              name=$(basename "$f")
              want=$(sha256sum "$f" | cut -d' ' -f1)
              got=$(curl -fsSL "$base/$name?$(date +%s)" | sha256sum | cut -d' ' -f1 || true)
              [ "$got" = "$want" ] || { ok=0; break; }
            done
            [ $ok = 1 ] && echo "live: $base/" && exit 0
            sleep 5
          done
          echo "preview did not go live in time" && exit 1
