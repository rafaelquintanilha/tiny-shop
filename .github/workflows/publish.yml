name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  publish:
    name: Publish main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Copy public/ to the site root, keeping PR previews
        run: |
          cd site
          find . -maxdepth 1 -type f ! -name '.nojekyll' -delete
          cp -R ../main/public/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish main (${{ github.sha }})" || echo "no changes"
          git push origin HEAD:gh-pages
